<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Jersey | Support Bot Status</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #05070a;
            --card: #0f121a;
            --primary: #5865F2;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --text: #ffffff;
            --text-dim: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            line-height: 1.5;
        }

        .dashboard {
            width: 100%;
            max-width: 800px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
        }

        .main-title {
            text-align: center;
            margin-bottom: 10px;
        }
        .main-title h1 {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -1px;
            background: linear-gradient(90deg, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .main-title p {
            color: var(--primary);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.8rem;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* Top Stats */
        .header-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
        }
        .stat-box {
            background: rgba(255,255,255,0.03);
            padding: 16px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }
        .stat-label { color: var(--text-dim); font-size: 0.75rem; text-transform: uppercase; font-weight: 600; }
        .stat-value { font-size: 1.25rem; font-weight: 700; margin-top: 4px; }

        /* Status Hero */
        .status-hero {
            text-align: center;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .indicator {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            margin-bottom: 20px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #1a1f2e;
        }
        .indicator::after {
            content: '';
            position: absolute;
            width: 100%; height: 100%;
            border-radius: 50%;
            animation: pulse 2s infinite;
            display: none;
        }
        .indicator.online { background: rgba(16, 185, 129, 0.1); color: var(--success); }
        .indicator.online::after { display: block; background: var(--success); }
        .indicator.offline { background: rgba(239, 68, 68, 0.1); color: var(--danger); }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.4; }
            100% { transform: scale(2.2); opacity: 0; }
        }

        .status-label { font-size: 1.75rem; font-weight: 800; }
        .status-desc { color: var(--text-dim); font-size: 0.9rem; margin-top: 4px; }

        /* Progress Bar */
        .progress-container {
            width: 100%; height: 4px; background: rgba(255,255,255,0.05);
            border-radius: 2px; overflow: hidden; margin-top: 30px;
        }
        #progress-fill { height: 100%; width: 0%; background: var(--primary); transition: width 1s linear; }

        /* Logs */
        .logs-container { display: flex; flex-direction: column; gap: 12px; }
        .logs-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .log-item {
            display: flex;
            align-items: flex-start;
            gap: 16px;
            padding: 16px;
            background: rgba(255,255,255,0.02);
            border-radius: 12px;
            border-left: 4px solid var(--text-dim);
        }
        .log-item.up { border-left-color: var(--success); }
        .log-item.down { border-left-color: var(--danger); }
        
        .log-info { flex-grow: 1; }
        .log-msg { font-weight: 600; font-size: 0.9rem; }
        .log-meta { font-size: 0.8rem; color: var(--text-dim); margin-top: 2px; }
        .log-duration {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            padding: 2px 8px;
            border-radius: 4px;
            margin-top: 8px;
            display: inline-block;
        }
        .log-item.up .log-duration {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
        }

        .btn-clear {
            background: transparent; border: 1px solid var(--border);
            color: var(--text-dim); padding: 6px 14px; border-radius: 6px;
            cursor: pointer; font-size: 0.75rem; transition: 0.2s;
        }
        .btn-clear:hover { background: var(--danger); color: white; border-color: var(--danger); }

        .empty-state { text-align: center; color: var(--text-dim); padding: 30px 0; font-size: 0.85rem; }
    </style>
</head>
<body>

<div class="dashboard">
    <div class="main-title">
        <h1>New Jersey | Support Bot</h1>
        <p>Uptime Panel</p>
    </div>

    <!-- Stats Row -->
    <div class="header-stats">
        <div class="stat-box">
            <div class="stat-label">Availability</div>
            <div id="stat-uptime-percent" class="stat-value">100%</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">Total Incidents</div>
            <div id="stat-down-count" class="stat-value">0</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">Last Check</div>
            <div id="stat-last-time" class="stat-value">--:--</div>
        </div>
    </div>

    <!-- Status Card -->
    <div class="card">
        <div class="status-hero">
            <div id="main-indicator" class="indicator">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
            </div>
            <div id="status-title" class="status-label">CONNECTING...</div>
            <div id="status-desc" class="status-desc">Synchronizing with server</div>
            
            <div class="progress-container">
                <div id="progress-fill"></div>
            </div>
        </div>
    </div>

    <!-- Logs Card -->
    <div class="card">
        <div class="logs-header">
            <h2 style="font-size: 1rem; font-weight: 700;">Incident History</h2>
            <button class="btn-clear" onclick="clearLogs()">Clear History</button>
        </div>
        <div id="logs-list" class="logs-container">
            <!-- Logs will appear here -->
        </div>
    </div>
</div>

<script>
    const TARGET_URL = "https://newjersey-support.onrender.com/";
    const CHECK_INTERVAL = 60;
    
    const mainIndicator = document.getElementById("main-indicator");
    const statusTitle = document.getElementById("status-title");
    const statusDesc = document.getElementById("status-desc");
    const progressFill = document.getElementById("progress-fill");
    const logsList = document.getElementById("logs-list");
    
    const statUptime = document.getElementById("stat-uptime-percent");
    const statDownCount = document.getElementById("stat-down-count");
    const statLastTime = document.getElementById("stat-last-time");

    let lastStatus = null; 
    let downStartTime = localStorage.getItem('down_start_time') ? parseInt(localStorage.getItem('down_start_time')) : null;
    let history = JSON.parse(localStorage.getItem('nj_bot_logs') || '[]');
    let totalChecks = parseInt(localStorage.getItem('nj_total_checks') || '0');
    let successfulChecks = parseInt(localStorage.getItem('nj_success_checks') || '0');

    function saveStats() {
        localStorage.setItem('nj_total_checks', totalChecks);
        localStorage.setItem('nj_success_checks', successfulChecks);
        updateStatsUI();
    }

    function updateStatsUI() {
        const percent = totalChecks === 0 ? 100 : ((successfulChecks / totalChecks) * 100).toFixed(2);
        statUptime.innerText = `${percent}%`;
        statDownCount.innerText = history.filter(l => l.type === 'down').length;
    }

    async function checkBot() {
        let isOnline = false;
        const now = new Date();
        const timestamp = now.getTime();
        const timeStr = now.toLocaleTimeString('en-US', { hour12: false });
        const dateStr = now.toLocaleDateString('en-US');

        totalChecks++;

        try {
            const proxy = `https://api.allorigins.win/get?url=${encodeURIComponent(TARGET_URL)}&t=${timestamp}`;
            const res = await fetch(proxy);
            const data = await res.json();
            
            if (data && data.contents && data.contents.trim().includes("OK")) {
                isOnline = true;
                successfulChecks++;
            }
        } catch (e) {
            isOnline = false;
        }

        updateStatusUI(isOnline, timeStr);
        handleLogs(isOnline, dateStr, timeStr, timestamp);
        saveStats();
        startProgress();
    }

    function updateStatusUI(isOnline, timeStr) {
        statLastTime.innerText = timeStr;
        if (isOnline) {
            mainIndicator.className = "indicator online";
            statusTitle.innerText = "ONLINE";
            statusTitle.style.color = "var(--success)";
            statusDesc.innerText = "System is operational and responding to requests.";
        } else {
            mainIndicator.className = "indicator offline";
            statusTitle.innerText = "OFFLINE";
            statusTitle.style.color = "var(--danger)";
            statusDesc.innerText = "Connection lost. Bot is currently unreachable.";
        }
    }

    function handleLogs(isOnline, date, time, timestamp) {
        const currentStatus = isOnline ? 'online' : 'offline';

        if (lastStatus !== null && lastStatus !== currentStatus) {
            let logEntry = {
                date, time, timestamp,
                type: isOnline ? 'up' : 'down',
                msg: isOnline ? 'System Restored' : 'Connection Lost (Down)'
            };

            if (!isOnline) {
                downStartTime = timestamp;
                localStorage.setItem('down_start_time', downStartTime);
            } else if (isOnline && downStartTime) {
                const diffMs = timestamp - downStartTime;
                const mins = Math.floor(diffMs / 60000);
                const secs = ((diffMs % 60000) / 1000).toFixed(0);
                logEntry.duration = `Downtime: ${mins}m ${secs}s`;
                downStartTime = null;
                localStorage.removeItem('down_start_time');
            }

            history.unshift(logEntry);
            if (history.length > 50) history.pop();
            localStorage.setItem('nj_bot_logs', JSON.stringify(history));
            renderLogs();
        }
        lastStatus = currentStatus;
    }

    function renderLogs() {
        if (history.length === 0) {
            logsList.innerHTML = '<div class="empty-state">No incidents recorded yet. Monitoring...</div>';
            return;
        }

        logsList.innerHTML = history.map(log => `
            <div class="log-item ${log.type}">
                <div class="log-info">
                    <div class="log-msg" style="color:${log.type === 'up' ? 'var(--success)' : 'var(--danger)'}">
                        ${log.type === 'up' ? '▲ ' : '▼ '}${log.msg}
                    </div>
                    <div class="log-meta">${log.date} at ${log.time}</div>
                    ${log.duration ? `<div class="log-duration">${log.duration}</div>` : ''}
                </div>
            </div>
        `).join('');
    }

    function startProgress() {
        progressFill.style.transition = 'none';
        progressFill.style.width = '0%';
        setTimeout(() => {
            progressFill.style.transition = `width ${CHECK_INTERVAL}s linear`;
            progressFill.style.width = '100%';
        }, 100);
    }

    function clearLogs() {
        if(confirm("All logs and statistics will be permanently deleted. Continue?")) {
            localStorage.clear();
            history = []; totalChecks = 0; successfulChecks = 0; downStartTime = null;
            renderLogs(); updateStatsUI();
        }
    }

    renderLogs();
    updateStatsUI();
    checkBot();
    setInterval(checkBot, CHECK_INTERVAL * 1000);
</script>

</html>
