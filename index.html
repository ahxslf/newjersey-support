<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Jersey | Support Bot Status</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #05070a;
            --card: #0f121a;
            --primary: #5865F2;
            --success: #10b981;
            --danger: #ef4444;
            --text: #ffffff;
            --text-dim: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .dashboard {
            width: 100%;
            max-width: 700px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .main-title {
            text-align: center;
            margin-bottom: 10px;
        }
        .main-title h1 {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(90deg, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .main-title p {
            color: var(--primary);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-size: 0.75rem;
            margin-top: 5px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
        }
        .stat-box {
            background: rgba(255,255,255,0.02);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--border);
            text-align: center;
        }
        .stat-label { color: var(--text-dim); font-size: 0.7rem; text-transform: uppercase; margin-bottom: 5px; }
        .stat-value { font-size: 1.1rem; font-weight: 700; }

        .status-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
        }
        .indicator {
            width: 60px; height: 60px; border-radius: 50%;
            margin-bottom: 15px; position: relative;
            background: #1a1f2e;
            display: flex; justify-content: center; align-items: center;
        }
        .indicator.online { color: var(--success); box-shadow: 0 0 20px rgba(16, 185, 129, 0.2); }
        .indicator.offline { color: var(--danger); box-shadow: 0 0 20px rgba(239, 68, 68, 0.2); }
        
        .indicator.online::after {
            content: ''; position: absolute; inset: 0; border-radius: 50%;
            background: var(--success); animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.4; }
            100% { transform: scale(2); opacity: 0; }
        }

        .status-label { font-size: 1.5rem; font-weight: 800; }
        
        .progress-bar {
            width: 100%; height: 4px; background: rgba(255,255,255,0.05);
            margin-top: 25px; border-radius: 2px; overflow: hidden;
        }
        #bar-fill { height: 100%; width: 0%; background: var(--primary); transition: width 1s linear; }

        .logs-title {
            font-size: 0.9rem; font-weight: 700; color: var(--text-dim);
            margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px;
            border-bottom: 1px solid var(--border); padding-bottom: 10px;
        }
        .log-item {
            padding: 12px;
            border-radius: 8px;
            background: rgba(255,255,255,0.01);
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 3px solid var(--text-dim);
        }
        .log-item.up { border-left-color: var(--success); }
        .log-item.down { border-left-color: var(--danger); }
        
        .log-main { font-weight: 600; font-size: 0.85rem; }
        .log-date { font-size: 0.75rem; color: var(--text-dim); }
        .log-duration { 
            font-size: 0.7rem; background: rgba(255,255,255,0.05); 
            padding: 2px 6px; border-radius: 4px; margin-top: 4px;
            display: inline-block;
        }
    </style>
</head>
<body>

<div class="dashboard">
    <div class="main-title">
        <h1>New Jersey | Support Bot</h1>
        <p>Uptime Panel</p>
    </div>

    <div class="stats-grid">
        <div class="stat-box">
            <div class="stat-label">Uptime</div>
            <div id="stat-uptime" class="stat-value">100%</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">Incidents</div>
            <div id="stat-incidents" class="stat-value">0</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">Last Check</div>
            <div id="stat-last" class="stat-value">--:--</div>
        </div>
    </div>

    <div class="card">
        <div class="status-section">
            <div id="indicator" class="indicator">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
            </div>
            <div id="status-text" class="status-label">CHECKING...</div>
            <div class="progress-bar">
                <div id="bar-fill"></div>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="logs-title">Incident History</div>
        <div id="logs-list">
            <!-- Logs appear here -->
        </div>
    </div>
</div>

<script>
    const URL = "https://newjersey-support.onrender.com/";
    const PROXY = "https://api.allorigins.win/raw?url="; // Using the 'raw' proxy from v2 which worked
    
    let history = JSON.parse(localStorage.getItem('nj_logs_v5') || '[]');
    let totalChecks = parseInt(localStorage.getItem('nj_total_v5') || '0');
    let successChecks = parseInt(localStorage.getItem('nj_success_v5') || '0');
    let lastStatus = null;
    let downStart = localStorage.getItem('nj_down_start_v5') ? parseInt(localStorage.getItem('nj_down_start_v5')) : null;

    async function check() {
        const now = new Date();
        const timeStr = now.toLocaleTimeString('en-US', { hour12: false });
        const dateStr = now.toLocaleDateString('en-US');
        let isOnline = false;

        totalChecks++;

        try {
            // Reverting to the logic that worked in the first versions
            const res = await fetch(PROXY + encodeURIComponent(URL) + "&t=" + now.getTime());
            const text = await res.text();
            
            if (text.trim() === "OK") {
                isOnline = true;
                successChecks++;
            }
        } catch (e) {
            isOnline = false;
        }

        updateUI(isOnline, timeStr);
        handleLogs(isOnline, dateStr, timeStr, now.getTime());
        
        localStorage.setItem('nj_total_v5', totalChecks);
        localStorage.setItem('nj_success_v5', successChecks);
        startProgress();
    }

    function updateUI(isOnline, timeStr) {
        const ind = document.getElementById("indicator");
        const txt = document.getElementById("status-text");
        
        document.getElementById("stat-last").innerText = timeStr;
        document.getElementById("stat-uptime").innerText = totalChecks === 0 ? "100%" : ((successChecks/totalChecks)*100).toFixed(2) + "%";
        document.getElementById("stat-incidents").innerText = history.filter(l => l.type === 'down').length;

        if (isOnline) {
            ind.className = "indicator online";
            txt.innerText = "ONLINE";
            txt.style.color = "var(--success)";
        } else {
            ind.className = "indicator offline";
            txt.innerText = "OFFLINE";
            txt.style.color = "var(--danger)";
        }
    }

    function handleLogs(isOnline, date, time, ts) {
        const current = isOnline ? 'online' : 'offline';
        if (lastStatus !== null && lastStatus !== current) {
            let log = { date, time, ts, type: isOnline ? 'up' : 'down', msg: isOnline ? 'System Restored' : 'Connection Lost' };

            if (!isOnline) {
                downStart = ts;
                localStorage.setItem('nj_down_start_v5', downStart);
            } else if (isOnline && downStart) {
                const diff = ts - downStart;
                const m = Math.floor(diff / 60000);
                const s = Math.floor((diff % 60000) / 1000);
                log.duration = `Downtime: ${m}m ${s}s`;
                downStart = null;
                localStorage.removeItem('nj_down_start_v5');
            }

            history.unshift(log);
            if (history.length > 50) history.pop();
            localStorage.setItem('nj_logs_v5', JSON.stringify(history));
            renderLogs();
        }
        lastStatus = current;
    }

    function renderLogs() {
        const list = document.getElementById("logs-list");
        if (history.length === 0) {
            list.innerHTML = '<div style="text-align:center; color:var(--text-dim); font-size:0.8rem;">Monitoring started. No incidents yet.</div>';
            return;
        }
        list.innerHTML = history.map(l => `
            <div class="log-item ${l.type}">
                <div>
                    <div class="log-main" style="color:${l.type === 'up' ? 'var(--success)' : 'var(--danger)'}">${l.msg}</div>
                    <div class="log-date">${l.date} at ${l.time}</div>
                    ${l.duration ? `<div class="log-duration">${l.duration}</div>` : ''}
                </div>
            </div>
        `).join('');
    }

    function startProgress() {
        const fill = document.getElementById("bar-fill");
        fill.style.transition = 'none';
        fill.style.width = '0%';
        setTimeout(() => {
            fill.style.transition = 'width 60s linear';
            fill.style.width = '100%';
        }, 100);
    }

    renderLogs();
    check();
    setInterval(check, 60000);
</script>

</html>
