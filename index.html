<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bot Status & Logs</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f1a;
            --card-bg: rgba(22, 28, 45, 0.8);
            --primary: #5865F2;
            --success: #10b981;
            --danger: #ef4444;
            --text: #f8fafc;
            --text-muted: #64748b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at top right, rgba(88, 101, 242, 0.1), transparent 400px),
                radial-gradient(circle at bottom left, rgba(239, 68, 68, 0.05), transparent 400px);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .wrapper {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 30px;
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        /* Status Section */
        .status-header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 { font-size: 1.4rem; font-weight: 800; margin-bottom: 5px; }
        .url-text { font-size: 0.8rem; color: var(--text-muted); word-break: break-all; }

        .indicator-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 25px 0;
        }

        .status-dot {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--text-muted);
            margin-bottom: 15px;
            position: relative;
            transition: 0.5s;
        }

        .status-dot.online {
            background: var(--success);
            box-shadow: 0 0 30px rgba(16, 185, 129, 0.4);
        }
        .status-dot.online::after {
            content: ''; position: absolute; inset: 0; border-radius: 50%;
            background: var(--success); animation: pulse 2s infinite;
        }

        .status-dot.offline {
            background: var(--danger);
            box-shadow: 0 0 30px rgba(239, 68, 68, 0.4);
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.5; }
            100% { transform: scale(2.5); opacity: 0; }
        }

        .status-label { font-size: 1.5rem; font-weight: 700; }
        .last-check { font-size: 0.8rem; color: var(--text-muted); margin-top: 5px; }

        /* Logs Section */
        .logs-card {
            padding: 20px;
            max-height: 300px;
            display: flex;
            flex-direction: column;
        }

        .logs-title {
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .clear-btn {
            font-size: 0.7rem;
            background: rgba(255,255,255,0.05);
            border: none;
            color: var(--text-muted);
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
        }

        .logs-list {
            overflow-y: auto;
            flex-grow: 1;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            padding-right: 5px;
        }

        .logs-list::-webkit-scrollbar { width: 4px; }
        .logs-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }

        .log-item {
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            display: flex;
            justify-content: space-between;
        }

        .log-up { color: var(--success); }
        .log-down { color: var(--danger); }
        .log-time { color: var(--text-muted); }

        .refresh-progress-container {
            width: 100%;
            height: 3px;
            background: rgba(255,255,255,0.05);
            margin-top: 20px;
            border-radius: 2px;
            overflow: hidden;
        }
        #progress-bar {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 1s linear;
        }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="card">
        <div class="status-header">
            <h1>Bot Monitor</h1>
            <div class="url-text">https://newjersey-support.onrender.com/</div>
        </div>

        <div class="indicator-box">
            <div id="dot" class="status-dot"></div>
            <div id="status-text" class="status-label">Kontrol Ediliyor...</div>
            <div id="last-update" class="last-check">Bağlantı kuruluyor...</div>
        </div>

        <div class="refresh-progress-container">
            <div id="progress-bar"></div>
        </div>
    </div>

    <div class="card logs-card">
        <div class="logs-title">
            OLAY KAYITLARI (LOGS)
            <button class="clear-btn" onclick="clearLogs()">Temizle</button>
        </div>
        <div id="logs-list" class="logs-list">
            <!-- Loglar buraya eklenecek -->
        </div>
    </div>
</div>

<script>
    const TARGET_URL = "https://newjersey-support.onrender.com/";
    // AllOrigins JSON API kullanarak CORS engellerini daha stabil aşarız
    const PROXY_URL = "https://api.allorigins.win/get?url=";
    
    const dot = document.getElementById("dot");
    const statusText = document.getElementById("status-text");
    const lastUpdate = document.getElementById("last-update");
    const progressBar = document.getElementById("progress-bar");
    const logsList = document.getElementById("logs-list");

    let lastStatus = null; // null, 'online', 'offline'
    const CHECK_INTERVAL = 60; // saniye

    // Sayfa açıldığında logları yükle
    let history = JSON.parse(localStorage.getItem('bot_logs') || '[]');
    renderLogs();

    async function checkBot() {
        let isOnline = false;
        const now = new Date();
        const timeStr = now.toLocaleTimeString('tr-TR');
        const dateStr = now.toLocaleDateString('tr-TR');

        try {
            // API üzerinden içeriği alıyoruz
            const response = await fetch(`${PROXY_URL}${encodeURIComponent(TARGET_URL)}&t=${Date.now()}`);
            if (!response.ok) throw new Error("Proxy hatası");
            
            const data = await response.json();
            // Render "OK" döndürüyorsa data.contents "OK" olmalı
            if (data && data.contents && data.contents.trim() === "OK") {
                isOnline = true;
            }
        } catch (error) {
            console.error("Bağlantı Hatası:", error);
            isOnline = false;
        }

        updateUI(isOnline, timeStr);
        handleLogs(isOnline, dateStr, timeStr);
        startProgressBar();
    }

    function updateUI(isOnline, timeStr) {
        if (isOnline) {
            dot.className = "status-dot online";
            statusText.innerText = "ONLINE";
            statusText.style.color = "var(--success)";
        } else {
            dot.className = "status-dot offline";
            statusText.innerText = "OFFLINE";
            statusText.style.color = "var(--danger)";
        }
        lastUpdate.innerText = `Son Kontrol: ${timeStr}`;
    }

    function handleLogs(isOnline, date, time) {
        const currentStatus = isOnline ? 'online' : 'offline';

        // Durum değişikliği kontrolü
        if (lastStatus !== null && lastStatus !== currentStatus) {
            const message = isOnline ? "Sistem Geri Geldi" : "Bağlantı Kesildi";
            const type = isOnline ? "log-up" : "log-down";
            
            const newLog = {
                type: type,
                msg: message,
                date: date,
                time: time
            };

            history.unshift(newLog); // En başa ekle
            if (history.length > 50) history.pop(); // Maks 50 kayıt
            
            localStorage.setItem('bot_logs', JSON.stringify(history));
            renderLogs();
        }
        
        lastStatus = currentStatus;
    }

    function renderLogs() {
        if (history.length === 0) {
            logsList.innerHTML = '<div style="color:var(--text-muted); text-align:center; margin-top:20px;">Henüz bir olay kaydedilmedi.</div>';
            return;
        }

        logsList.innerHTML = history.map(log => `
            <div class="log-item">
                <span class="${log.type}">${log.msg}</span>
                <span class="log-time">${log.date} ${log.time}</span>
            </div>
        `).join('');
    }

    function clearLogs() {
        if(confirm("Tüm kayıtlar silinecek. Emin misiniz?")) {
            history = [];
            localStorage.setItem('bot_logs', '[]');
            renderLogs();
        }
    }

    function startProgressBar() {
        progressBar.style.transition = "none";
        progressBar.style.width = "0%";
        setTimeout(() => {
            progressBar.style.transition = `width ${CHECK_INTERVAL}s linear`;
            progressBar.style.width = "100%";
        }, 100);
    }

    // Başlat
    checkBot();
    setInterval(checkBot, CHECK_INTERVAL * 1000);
</script>

</body>
</html>
